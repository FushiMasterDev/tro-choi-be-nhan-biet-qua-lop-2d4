<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bé Nhận Biết Quả</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <section id="start">
    <div class="fruit" aria-hidden="true" style="font-size:64px;margin-bottom:8px">🍎🍌🍇</div>
    <h1><span>Bé</span> <span>Nhận</span> <span>Biết</span> <span>Quả</span> <span>!</span></h1>
    <p>10 câu hỏi — nghe cô hỏi rồi chọn đúng hình quả nhé</p>
    <button class="btn" id="startBtn">Bắt đầu</button>
  </section>

  <section id="quiz" hidden>
    <div class="top">
      <span id="count">Câu 1/10</span>
      <button class="replay" id="replayBtn" aria-label="Nghe lại câu hỏi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        Nghe lại
      </button>
      <span id="points">⭐ 0</span>
    </div>
    <div class="bar" aria-hidden="true"><div id="progress"></div></div>
    <div class="question" id="qText"></div>
    <div class="fruit" id="show" aria-hidden="true" hidden></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>

  <section id="result" hidden>
    <h1><span>Giỏi</span> <span>quá</span><span>!</span></h1>
    <div class="score" id="finalScore"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <p id="resultMsg"></p>
    <button class="btn" id="againBtn">Chơi lại</button>
  </section>
</main>

<script>
// shortcut: fruit pictures are emoji (look differs slightly per device); swap for SVG/PNG if exact art matters.
const FRUITS = {
  "Táo": ["🍎", "quả táo"], "Chuối": ["🍌", "quả chuối"], "Nho": ["🍇", "chùm nho"], "Cam": ["🍊", "quả cam"],
  "Dưa hấu": ["🍉", "quả dưa hấu"], "Dứa": ["🍍", "quả dứa"], "Dâu tây": ["🍓", "quả dâu tây"],
  "Xoài": ["🥭", "quả xoài"], "Dừa": ["🥥", "quả dừa"], "Lê": ["🍐", "quả lê"],
};

window.GAME = {
  known: FRUITS, audioDir: "audio", readOptions: false, pics: true,
  option(b, name) { b.textContent = FRUITS[name][0]; b.setAttribute("aria-label", FRUITS[name][1]); },
  wrongText: q => `Chưa đúng rồi, đây mới là ${FRUITS[q.answer][1]} nè!`,
  questions: [
    { answer: "Chuối",   q: "Đâu là quả chuối?",   options: ["Táo", "Chuối", "Nho"] },
    { answer: "Táo",     q: "Đâu là quả táo?",     options: ["Táo", "Dứa", "Dưa hấu"] },
    { answer: "Dưa hấu", q: "Đâu là quả dưa hấu?", options: ["Chuối", "Dừa", "Dưa hấu"] },
    { answer: "Nho",     q: "Đâu là chùm nho?",    options: ["Nho", "Cam", "Dứa"] },
    { answer: "Dứa",     q: "Đâu là quả dứa?",     options: ["Dâu tây", "Dứa", "Lê"] },
    { answer: "Cam",     q: "Đâu là quả cam?",     options: ["Nho", "Chuối", "Cam"] },
    { answer: "Dâu tây", q: "Đâu là quả dâu tây?", options: ["Dâu tây", "Dừa", "Chuối"] },
    { answer: "Xoài",    q: "Đâu là quả xoài?",    options: ["Nho", "Xoài", "Dưa hấu"] },
    { answer: "Dừa",     q: "Đâu là quả dừa?",     options: ["Táo", "Lê", "Dừa"] },
    { answer: "Lê",      q: "Đâu là quả lê?",      options: ["Lê", "Dâu tây", "Nho"] },
  ],
};
</script>
<script src="quiz.js"></script>
</body>
</html>
